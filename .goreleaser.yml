version: 2

project_name: archguard

before:
  hooks:
    - go mod tidy

builds:
  - id: archguard
    main: ./cmd/archguard
    binary: archguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/honzikec/archguard/internal/cli.Version={{.Version}}
      - -X github.com/honzikec/archguard/internal/cli.Commit={{.Commit}}
      - -X github.com/honzikec/archguard/internal/cli.BuildDate={{.Date}}

archives:
  - id: archguard
    ids:
      - archguard
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: honzikec
      name: homebrew-tap
      branch: main
    directory: Formula
    homepage: https://github.com/honzikec/archguard
    description: Deterministic architecture policy checker for TS/JS/PHP repositories
    license: MIT
    test: |
      system "#{bin}/archguard", "version"

release:
  mode: append

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
